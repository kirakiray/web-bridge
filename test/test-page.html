<!doctype html>
<!-- web-bridge-mcp 手动测试页：真实浏览器链路验证
     用法：任意静态服务器打开本文件（或直接双击 file:// 打开），保持页面开启；
     在 AI 编辑器（已配置 web-bridge-mcp MCP）里依次验证：
       1. list_pages —— 应看到本页（标题含 "web-bridge-mcp 测试页"）
       2. eval_js：document.title / $ && $("#count").textContent
       3. click {selector: "#btn"} —— 计数应 +1，get_console 应有日志
       4. type {selector: "#name", text: "AI"} —— 输入框出现 "AI"
       5. get_text {} —— 返回页面正文文本
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>web-bridge-mcp 测试页</title>
  <!-- 默认端口 3210；改过端口请同步修改这里 -->
  <script src="http://127.0.0.1:3210/client.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; }
    button { font-size: 16px; padding: 8px 16px; }
    input { font-size: 16px; padding: 6px; }
    #log { white-space: pre-wrap; background: #f5f5f5; padding: 12px; min-height: 60px; }
  </style>
</head>
<body>
  <h2>web-bridge-mcp 测试页</h2>
  <p>点击次数：<span id="count">0</span></p>
  <button id="btn">点我 +1</button>
  <p>
    <label>名字：<input id="name" placeholder="用 type 工具填我"></label>
    <span id="greet"></span>
  </p>
  <h3>页面日志</h3>
  <div id="log"></div>

  <script>
    let n = 0;
    document.getElementById("btn").addEventListener("click", () => {
      n++;
      document.getElementById("count").textContent = String(n);
      console.log("按钮被点击，当前计数:", n); // 会被 client.js 捕获，供 get_console 验证
    });
    document.getElementById("name").addEventListener("input", (e) => {
      document.getElementById("greet").textContent = e.target.value ? `你好，${e.target.value}！` : "";
    });
    console.info("测试页已加载");
  </script>
</body>
</html>
